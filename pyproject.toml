[project]
name = "fastapi-version-manager"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Sayanc2000", email = "sayanc20002@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.5",
    "packaging>=24.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_version_manager"]

[tool.rye.scripts]
dev = "uvicorn examples.main:app --host 0.0.0.0 --port 8000 --reload"
