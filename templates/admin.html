<!DOCTYPE html>
    <html>
    <head>
        <title>FastAPI Admin - Routes</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            .route { 
                border: 1px solid #ddd; 
                margin: 10px 0; 
                padding: 15px;
                border-radius: 4px;
            }
            .method {
                display: inline-block;
                padding: 3px 8px;
                border-radius: 3px;
                margin-right: 10px;
                background: #eee;
                font-weight: bold;
            }
            .path { font-size: 1.1em; }
            .name { color: #666; margin-top: 5px; }
        </style>
    </head>
    <body>
        <h1>FastAPI Routes</h1>
        {% for route in routes %}
        <div class="route">
            <div>
                {% for method in route.methods %}
                <span class="method">{{ method }}</span>
                {% endfor %}
                <span class="path">{{ route.path }}</span>
            </div>
            <div class="name">Name: {{ route.name }}</div>
        </div>
        {% endfor %}
    </body>
    </html>
